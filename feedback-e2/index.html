function fotoE3(d){const s=d.sprint||{},fecha=(d.generado||'').replace('T',' '),sprint=[s.situacion,s.nombre,s.inicio&&s.fin?s.inicio+' - '+s.fin:''].filter(Boolean).join(' · '),filas=(d.personas||[]).map(p=>{const t=p.tarea,doc=p.doc,tarea=t?`${t.url?`<a href="${t.url}" target="_blank" rel="noopener">${t.clave}</a>`:t.clave||'Tarea sin clave'}${t.estado?' · '+t.estado:''}<br>${t.resumen||''}<br><span class="${t.en_sprint?'ok':'bad'}">${t.en_sprint?'En el sprint':'Fuera del sprint'}</span>`:'<span class="bad">Sin tarea Jira</span>',documento=doc?`${doc.url?`<a href="${doc.url}" target="_blank" rel="noopener">${doc.titulo||'Documento'}</a>`:doc.titulo||'Documento'}<br><small>${doc.nuevo?'Nuevo en E3':'Documento anterior'}${doc.versiones?' · '+doc.versiones+' versiones':''}${doc.editada?' · '+doc.editada:''}${doc.edita_el?' · editada por esta persona':''}</small>`:'<span class="bad">Sin documento vivo</span>',enlaces={'documento':'<span class="ok">Enlaza a su documento</span>','otra página':'<span class="warn">Enlaza a otra página</span>','sin verificar':'<span class="warn">Enlace sin verificar</span>','':'<span class="bad">Sin enlace a Confluence</span>'},enlace=t?(enlaces[t.enlace_doc||'']||'<span class="warn">Enlace sin verificar</span>'):'<span class="bad">Sin tarea Jira</span>',marcas=[p.cuenta_grupo?'Cuenta de grupo':'',p.en_sitio===false?'No figura en el sitio':''].filter(Boolean).join(' · ');return `<tr><th scope="row">${p.nombre}${marcas?`<br><small>${marcas}</small>`:''}</th><td>${tarea}</td><td>${documento}</td><td>${enlace}</td></tr>`}).join(''),tabla=filas?`<div class="tabla-wrap"><table><thead><tr><th>Persona</th><th>Tarea Jira</th><th>Documento Confluence</th><th>Enlace desde Jira</th></tr></thead><tbody>${filas}</tbody></table></div>`:'<p class="meta">La comprobación no devolvió integrantes para este equipo.</p>';const av=(d.avisos||[]),avisos=av.length?`<div class="e3 avisos"><b>E3 a ${fecha.slice(0,16)}: qué os falta</b><ul class="corr">${av.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`:`<div class="e3 avisos"><b>E3 a ${fecha.slice(0,16)}:</b> sprint, tareas, documentos y enlaces al día.</div>`;return avisos+`<details class="foto-e3" open><summary>Foto E3 · última comprobación ${fecha}</summary><p class="meta">Instantánea, no es en tiempo real · comprobación desde ${d.desde}${sprint?' · Sprint: '+sprint:''}</p>${tabla}</details>`;}
function card(t,qr){return `<div class="top"><div class="pieza"><h2>Equipo ${t.code}</h2><p><b>Pieza:</b> ${t.comp}</p><p><b>Rutas:</b> ${t.rutas}</p></div>
<div class="total"><b>${n1(t.tot.toFixed(1))}</b><span>de ${n1(t.mx.toFixed(1))} en los bloques de equipo</span></div>${qr||''}</div>
<div class="bloques">${t.bl.map(b=>`<div class="b"><div class="c" style="background:${col[b.n]}"><strong>${b.n}. ${b.name}</strong><em>${n1(b.g)} / ${n1(b.M)}</em></div></div>`).join('')}</div>
<div class="e3"><p class="mant"><b>Resumen E2:</b> ${t.resumen}</p><b>Para la E3:</b><ul class="corr">${t.corr.map(x=>'<li>'+x+'</li>').join('')}</ul></div>${fotoE3(t.estado_e3)}`;}
const m=document.getElementById('m'),nav=document.getElementById('nav');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(keyBytes,blob){const raw=b64(blob);const key=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))));}
async function pwKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ADM.s),iterations:ADM.i},base,256));}
let D=null,cur=0,locked=false;
function no(){nav.hidden=true;m.innerHTML='<div class="e3">Escanead el código QR de vuestro equipo para ver vuestro feedback.</div><a class="prof" onclick="login()">Acceso profesor</a>';}
function login(msg){nav.hidden=true;m.innerHTML=`<div class="login"><b>Acceso profesor</b>${msg?'<p style="color:#C0504D">'+msg+'</p>':''}<input id="pw" type="password" placeholder="Contraseña" autocomplete="off"><button class="btn" onclick="enter()">Entrar</button></div>`;
const i=document.getElementById('pw');i.focus();i.onkeydown=e=>{if(e.key==='Enter')enter();};}
async function enter(){const pw=document.getElementById('pw').value;try{const k=await pwKey(pw);if(!D)D=await dec(k,ADM.d);locked=false;admin(cur);}catch(e){login('Contraseña incorrecta');}}
async function admin(i){cur=i;const a=D[i],h=decodeURIComponent((a.url.split('#')[1]||'')),p=h.indexOf('-');
if(p<0||!B[a.code]){m.innerHTML='<div class="e3">No se pudo localizar el contenido actualizado del equipo.</div>';return;}
const k=h.slice(p+1).replace(/-/g,'+').replace(/_/g,'/');let t;
try{t=await dec(b64(k+'==='.slice((k.length+3)%4)),B[a.code]);}
catch(e){if(cur===i)m.innerHTML='<div class="e3">No se pudo descifrar el contenido actualizado del equipo.</div>';throw e;}
t.qr=a.qr;t.url=a.url;
if(cur!==i)return;nav.hidden=locked;
nav.innerHTML=D.map((x,j)=>`<button class="${j===i?'on':''}" onclick="admin(${j})">${x.code}</button>`).join('')+'<button class="btn lock" onclick="lock()">Bloquear en este equipo</button>';
m.innerHTML=card(t,`<div class="qr">${a.qr}<div><b>Solo el equipo ${a.code}</b><br>Escanead con el móvil (datos)${locked?'':`<div class="lnk"><input readonly value="${a.url}" aria-label="Enlace privado del equipo ${a.code}"><button class="btn cp" onclick="copiar(this)">Copiar enlace</button></div>`}</div></div>`)+(locked?'<a class="prof" onclick="login()">Desbloquear (profesor)</a>':'');}
function lock(){locked=true;admin(cur);}
function copiar(btn){const i=btn.previousElementSibling,ok=()=>{btn.textContent='Copiado ✔';setTimeout(()=>btn.textContent='Copiar enlace',1500);};
navigator.clipboard.writeText(i.value).then(ok).catch(()=>{i.select();document.execCommand('copy');ok();});}
document.addEventListener('keydown',e=>{if(!D||locked||document.getElementById('pw'))return;if(e.key==='ArrowRight')admin(Math.min(D.length-1,cur+1));if(e.key==='ArrowLeft')admin(Math.max(0,cur-1));});
(async()=>{try{const h=decodeURIComponent(location.hash.slice(1));if(h==='profesor')return login();const i=h.indexOf('-');if(i<0)return no();
const code=h.slice(0,i),k=h.slice(i+1).replace(/-/g,'+').replace(/_/g,'/');if(!B[code])return no();
const t=await dec(b64(k+'==='.slice((k.length+3)%4)),B[code]);document.title='Feedback E2 · '+t.code;m.innerHTML=card(t);
}catch(e){no();}})();
</script></body></html>
