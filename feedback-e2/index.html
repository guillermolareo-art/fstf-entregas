<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Feedback E2</title><style>
:root{--azul:#0070C0;--navy:#0A1628;--naranja:#E07B39;--gris:#595959;--borde:#D4DCE6;--suave:#F7F9FC;--palido:#E8F1FA}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:#fff;color:#1A1A1A}
header{background:var(--navy);color:#fff;padding:18px 24px}header small{color:#F9C9A6;font-weight:700;letter-spacing:.06em;font-size:13px}
header h1{margin:4px 0 0;font-size:26px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:#fff}
nav button{font:inherit;font-size:17px;font-weight:700;padding:8px 14px;border:1px solid var(--borde);border-radius:8px;background:var(--suave);color:var(--navy);cursor:pointer}
nav button.on{background:var(--azul);border-color:var(--azul);color:#fff}
main{max-width:1150px;margin:0 auto;padding:20px 24px 40px}
.top{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}
.pieza{flex:1 1 480px;background:var(--palido);border-left:5px solid var(--azul);padding:14px 18px;border-radius:0 8px 8px 0}
.pieza h2{margin:0 0 6px;font-size:28px}.pieza p{margin:4px 0;font-size:17px}
.total{flex:0 0 190px;background:var(--navy);color:#fff;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px}
.total b{font-size:44px;line-height:1}.total span{font-size:14px;opacity:.85;text-align:center}
.qr{flex:0 0 200px;border:1px solid var(--borde);border-radius:8px;padding:8px;text-align:center;font-size:13px;color:var(--gris)}
.qr svg{width:170px;height:170px}
.bloques{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
@media(max-width:900px){.bloques{grid-template-columns:1fr}}
.b{border:1px solid var(--borde);border-radius:8px;overflow:hidden;background:var(--suave)}
.b .c{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;color:#fff}
.b .c strong{font-size:17px}.b .c em{font-style:normal;font-size:21px;font-weight:700;white-space:nowrap}
.b p{margin:0;padding:12px 14px;font-size:16.5px;line-height:1.45}
.e3{margin-top:18px;background:#FDF1E8;border:1px solid var(--naranja);border-radius:8px;padding:12px 18px;font-size:17px}
.nota{color:var(--gris);font-size:14px;margin-top:14px}
</style></head><body>

const col={'1':'#0070C0','2':'#4F8A5B','3':'#E07B39'};
const n1=x=>String(x).replace('.',',');
function card(t,qr){return `<div class="top"><div class="pieza"><h2>Equipo ${t.code}</h2><p><b>Pieza:</b> ${t.comp}</p><p><b>Rutas:</b> ${t.rutas}</p></div>
<div class="total"><b>${n1(t.tot.toFixed(1))}</b><span>de ${n1(t.mx.toFixed(1))} en los bloques de equipo</span></div>${qr||''}</div>
<div class="bloques">${t.bl.map(b=>`<div class="b"><div class="c" style="background:${col[b.n]}"><strong>${b.n}. ${b.name}</strong><em>${n1(b.g)} / ${n1(b.M)}</em></div><p>${b.t}</p></div>`).join('')}</div>
<div class="e3"><b>Para la E3:</b> estas correcciones van metidas, y el recuadro «De la E2 a la E3» de la primera página dice cuáles.</div>
<p class="nota">El bloque 4 (trazabilidad, firma y AIAS) es individual y no se muestra aquí.</p>`;}
const m=document.getElementById('m');
function no(){m.innerHTML='<div class="e3">Escanead el código QR de vuestro equipo para ver vuestro feedback.</div>';}
(async()=>{try{const h=decodeURIComponent(location.hash.slice(1));const i=h.indexOf('-');if(i<0)return no();
const code=h.slice(0,i),k=h.slice(i+1).replace(/-/g,'+').replace(/_/g,'/');if(!B[code])return no();
const kb=Uint8Array.from(atob(k+'==='.slice((k.length+3)%4)),c=>c.charCodeAt(0));
const raw=Uint8Array.from(atob(B[code]),c=>c.charCodeAt(0));
const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
const t=JSON.parse(new TextDecoder().decode(pt));document.title='Feedback E2 · '+t.code;m.innerHTML=card(t);
}catch(e){no();}})();
</script></body></html>
